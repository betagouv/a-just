<div class="title">
  <p>Extracteur de données d'activité</p>
</div>
<div class="exportateur-container">
  <aj-date-select class="extend" [title]="ajDateSelectTitle" dateType="month" [value]="dateStart"
    (valueChange)="selectDate('start', $event)" [manualInput]="true" [min]="minDate"
    [max]="dateStop || lastDataDate"></aj-date-select>
  <aj-date-select class="extend" title="Au" dateType="month" [value]="dateStop"
    (valueChange)="selectDate('stop', $event)" [manualInput]="true" [min]="dateStart"
    [max]="lastDataDate"></aj-date-select>

  <div id="export-excel-button" class="export-button {{ classSelected }}" (click)="exportActDate()">
    <mat-icon class="shape">save</mat-icon>
    <p>Télécharger le fichier au format Excel</p>
  </div>
</div>
